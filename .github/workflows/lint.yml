name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (golangci-lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      # Also enforces gofmt / goimports via the formatters section of .golangci.yml.
      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_IMAGE in the Makefile.
          version: v2.13.2
          working-directory: backend

  frontend:
    name: Frontend (tsc / eslint / prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # LayoutProps and route types are generated into .next/types, which a fresh checkout lacks.
      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check
